<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient Frame -->
    <linearGradient id="clinic-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Inner Shield Surface Gradient -->
    <linearGradient id="clinic-plate-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Tooth Gradient -->
    <linearGradient id="clinic-tooth-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f4ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>

    <!-- Cross Gradient -->
    <linearGradient id="clinic-cross-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="clinic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Outer Frame -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#clinic-bg-grad)" />
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#clinic-plate-grad)" />

  <!-- Modern Tooth Shape -->
  <path
    d="M 50 20
       C 63 20, 74 25, 74 38
       C 74 48, 70 58, 66 69
       C 62 78, 57 82, 54 82
       C 51.5 82, 50.5 77, 50 72
       C 49.5 77, 48.5 82, 46 82
       C 43 82, 38 78, 34 69
       C 30 58, 26 48, 26 38
       C 26 25, 37 20, 50 20 Z"
    fill="url(#clinic-tooth-grad)"
    filter="url(#clinic-glow)"
  />

  <!-- Tooth Ridge Gloss -->
  <path
    d="M 35 30 C 40 26, 46 26, 50 28 C 54 26, 60 26, 65 30"
    stroke="#818cf8"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
    opacity="0.65"
  />

  <!-- Medical Cross Accent -->
  <g transform="translate(50, 48)">
    <rect x="-3.5" y="-12" width="7" height="24" rx="3.5" fill="url(#clinic-cross-grad)" />
    <rect x="-12" y="-3.5" width="24" height="7" rx="3.5" fill="url(#clinic-cross-grad)" />
    <circle cx="0" cy="0" r="2.8" fill="#ffffff" />
  </g>

  <!-- Sparkle -->
  <path
    d="M 70 24 Q 73.5 24 73.5 20.5 Q 73.5 24 77 24 Q 73.5 24 73.5 27.5 Q 73.5 24 70 24 Z"
    fill="#38bdf8"
  />
</svg>
